[project]
name = "cogame-unixctf"
version = "0.1.0"
description = "Procedural Unix capture-the-flag environments for Unix-competence RL"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cogame-unixctf = "cogame_unixctf.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cogame_unixctf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
